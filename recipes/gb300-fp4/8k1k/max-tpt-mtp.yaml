base:
  name: "gb300-fp4-8k1k-mtp"
    partition: gb300

  dynamo:
    hash: "5b4bc1dd70965017a737c71b19db5a0aeaa88727"
    install: true

  frontend:
    type: dynamo
    enable_multiple_frontends: true
    num_additional_frontends: 9
    nginx_container: nginx

  model:
    path: "dsr1"
    container: "lmsysorg/sglang:v0.5.12.post1"
    precision: "fp4"

  resources:
    gpu_type: "gb300"
    gpus_per_node: 4
    gpus_per_prefill: 2
    prefill_nodes: 2
    prefill_workers: 4
    decode_nodes: 8
    decode_workers: 1

  # Common env vars for all workers (prefill + decode).
  # decode_environment below adds decode-only vars on top of these.
  environment:
    TORCH_DISTRIBUTED_DEFAULT_TIMEOUT: "1800"
    PYTHONUNBUFFERED: "1"
    DYN_SKIP_SGLANG_LOG_FORMATTING: "1"
    SGLANG_NVFP4_CKPT_FP8_GEMM_IN_ATTN: "1"
    SGLANG_PER_TOKEN_GROUP_QUANT_8BIT_V2: "1"
    SGLANG_DISAGGREGATION_HEARTBEAT_MAX_FAILURE: "100000"
    SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT: "100000"
    SGLANG_DISAGGREGATION_WAITING_TIMEOUT: "100000"
    MC_TE_METRIC: "true"
    MC_FORCE_MNNVL: "1"
    NCCL_MNNVL_ENABLE: "1"
    NCCL_CUMEM_ENABLE: "1"
    SGLANG_MOONCAKE_CUSTOM_MEM_POOL: "True"
    SGLANG_USE_MESSAGE_QUEUE_BROADCASTER: "0"
    SGLANG_DISABLE_TP_MEMORY_INBALANCE_CHECK: "1"
    SGLANG_ENABLE_SPEC_V2: "1"
    SGLANG_NVFP4_CKPT_FP8_NEXTN_MOE: "1"
    SGLANG_DEEPEP_NUM_MAX_DISPATCH_TOKENS_PER_RANK: "1024"
    # Need https://github.com/sgl-project/sglang/pull/26839 for SBO fix.
    # SGLANG_BLACKWELL_OVERLAP_SHARED_EXPERTS_OUTSIDE_SBO: "1"
    SGLANG_RADIX_FORCE_MISS: "1"

  backend:

    decode_environment:
      SGLANG_MOE_NVFP4_DISPATCH: "1"

    sglang_config:
      prefill:
        served-model-name: "deepseek-ai/DeepSeek-R1"
        model-path: "/model/"
        trust-remote-code: true

        kv-cache-dtype: "fp8_e4m3"
        attention-backend: "trtllm_mla"
        quantization: "modelopt_fp4"
        moe-runner-backend: "flashinfer_trtllm"

        stream-interval: 50
        decode-log-interval: 1000
        watchdog-timeout: 1000000
        context-length: 9600
        disaggregation-mode: "prefill"
        disaggregation-transfer-backend: nixl
        disaggregation-bootstrap-port: 30001

        mem-fraction-static: 0.85
        max-total-tokens: 131072
        max-prefill-tokens: 524288
        chunked-prefill-size: 131072
        max-running-requests: 30000
        load-balance-method: "round_robin"

        enable-dp-lm-head: true
        moe-dense-tp-size: 1
        enable-dp-attention: true
        disable-flashinfer-autotune: true

        tensor-parallel-size: 2
        data-parallel-size: 2
        expert-parallel-size: 2

      decode:
        served-model-name: "deepseek-ai/DeepSeek-R1"
        model-path: "/model/"
        trust-remote-code: true

        kv-cache-dtype: "fp8_e4m3"
        attention-backend: "trtllm_mla"
        quantization: "modelopt_fp4"
        moe-runner-backend: "flashinfer_cutedsl"

        stream-interval: 50
        decode-log-interval: 1000
        watchdog-timeout: 1000000
        context-length: 9600
        eplb-algorithm: "deepseek"
        disaggregation-mode: "decode"
        disaggregation-transfer-backend: nixl
        disaggregation-bootstrap-port: 30001

        mem-fraction-static: 0.8
        max-total-tokens: 524288
        chunked-prefill-size: 24576
        max-running-requests: 16384

        moe-a2a-backend: "deepep"
        deepep-mode: "low_latency"
        ep-dispatch-algorithm: "static"

        cuda-graph-max-bs: 256
        num-reserved-decode-tokens: 112

        moe-dense-tp-size: 1
        enable-dp-lm-head: true
        enable-dp-attention: true

        tensor-parallel-size: 32
        data-parallel-size: 32
        expert-parallel-size: 32

        speculative-algorithm: "EAGLE"
        speculative-num-steps: 3
        speculative-eagle-topk: 1
        speculative-num-draft-tokens: 4
        speculative-moe-runner-backend: "deep_gemm"
        speculative-moe-a2a-backend: "deepep"

  benchmark:
    type: "sa-bench"
    isl: 8192
    osl: 1024
    req_rate: "inf"
    concurrencies: "128x256x512"

# dep32 variants at mtp3 only.
# trtllm reference: ctx4(4p,2n)-dep32 ~180 conc, ctx8(8p,4n)-dep32 ~308 conc.
zip_override_dep32:
  name:
    - "gb300-fp4-8k1k-mtp3-4p-dep2-1d-dep32"
    - "gb300-fp4-8k1k-mtp3-8p-dep2-1d-dep32"
  resources:
    prefill_nodes:   [2, 4]
    prefill_workers: [4, 8]
    decode_nodes:    [8, 8]
  benchmark:
    concurrencies:
      - "128x256x512"
      - "256x512x1024"

# dep16 variants at mtp2 only.
# trtllm reference: ctx10-dep16 ~666 conc at mtp3. ctx13-dep16 ~1127 conc at mtp3.
zip_override_dep16:
  name:
    - "gb300-fp4-8k1k-mtp2-10p-dep2-1d-dep16"
    - "gb300-fp4-8k1k-mtp2-13p-dep2-1d-dep16"
  resources:
    prefill_nodes: [5, 7]
    prefill_workers: [10, 13]
    decode_nodes: 4
  backend:
    sglang_config:
      decode:
        tensor-parallel-size: 16
        data-parallel-size: 16
        expert-parallel-size: 16
        max-total-tokens: 2097152
        speculative-num-steps: 2
        speculative-num-draft-tokens: 3
  benchmark:
    concurrencies:
     - "512x1024x2048"
     - "1024x2048"
